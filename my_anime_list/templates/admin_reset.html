<!DOCTYPE html>
<html lang="es" data-theme="cupcake">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔧 Admin - Reset de Fábrica</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #fee2e2, #fecaca, #fca5a5);
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-white shadow-2xl border-2 border-red-300">
    <div class="card-body">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-4xl">⚠️</span>
        <h2 class="card-title text-2xl text-red-600">Reset de Fábrica</h2>
      </div>
      
      {% if error %}
      <div class="alert alert-error mb-4">
        <span>{{ error }}</span>
      </div>
      {% endif %}
      
      <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
        <p class="text-sm text-gray-700 font-semibold mb-2">Esta acción:</p>
        <ul class="text-xs text-gray-600 space-y-1 ml-4 list-disc">
          <li>Eliminará todos los usuarios temporales</li>
          <li>Restaurará todas las valoraciones originales</li>
          <li>Volverá la base de datos a su estado inicial</li>
          <li><strong class="text-red-600">No se puede deshacer</strong></li>
        </ul>
      </div>
      
      <form method="post" action="/admin/factory_reset" 
            onsubmit="return confirm('🚨 ¿ESTÁS COMPLETAMENTE SEGURO?\n\nEsto eliminará TODOS los datos temporales y restaurará la base de datos original.\n\n¿Continuar?')">
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold">Contraseña de Administrador:</span>
          </label>
          <input type="password" name="password" placeholder="Ingresa la contraseña" 
                 class="input input-bordered border-red-300 focus:border-red-500" 
                 required autofocus />
          <label class="label">
            <span class="label-text-alt text-gray-500">Contraseña por defecto: 123456</span>
          </label>
        </div>
        
        <div class="card-actions justify-between mt-6">
          <a href="/" class="btn btn-ghost">
            ← Volver
          </a>
          <button type="submit" class="btn btn-error">
            Ejecutar Reset
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
